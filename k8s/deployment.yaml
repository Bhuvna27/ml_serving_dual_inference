apiVersion: apps/v1
kind: Deployment
metadata:
  name: taxi-fare-api
  labels:
    app: taxi-fare-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taxi-fare-api
  template:
    metadata:
      labels:
        app: taxi-fare-api
    spec:
      containers:
        - name: taxi-fare-api
          image: taxi-fare-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3